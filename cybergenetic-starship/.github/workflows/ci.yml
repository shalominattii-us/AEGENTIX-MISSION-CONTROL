name: cybergenetic-starship-ci
on:
  push:
    paths: ['cybergenetic-starship/**']
  pull_request:
    paths: ['cybergenetic-starship/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cybergenetic-starship
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cybergenetic-starship/package.json
      - run: npm install
      - run: npm test
      - run: npm run build
